apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: codesage-production
  labels:
    app: codesage-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codesage-frontend
  template:
    metadata:
      labels:
        app: codesage-frontend
    spec:
      containers:
        - name: frontend
          image: codesage/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: codesage-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: codesage-production
spec:
  selector:
    app: codesage-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
