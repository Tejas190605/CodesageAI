apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codesage-ingress
  namespace: codesage-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.codesage.ai
        - api.codesage.ai
      secretName: codesage-tls-certs
  rules:
    - host: app.codesage.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: api.codesage.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
