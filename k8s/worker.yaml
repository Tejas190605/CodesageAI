apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: codesage-production
  labels:
    app: codesage-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codesage-worker
  template:
    metadata:
      labels:
        app: codesage-worker
    spec:
      containers:
        - name: worker
          image: codesage/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: codesage-config
            - secretRef:
                name: codesage-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: codesage-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
